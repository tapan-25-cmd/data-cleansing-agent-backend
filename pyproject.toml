[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uom-data-cleansing-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pymongo>=4.8,<5",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
ai = ["google-adk>=2,<3"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build]
include = ["app/**/*.py", "app/rules/*.yaml", "app/evaluations/*.yaml", "app/agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
